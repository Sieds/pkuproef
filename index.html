<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKU Kookboek - Redirect</title>
    <link rel="alternate" hreflang="nl" href="https://pkuproef.nl/nl/">
    <link rel="alternate" hreflang="en" href="https://pkuproef.nl/en/">
    <link rel="alternate" hreflang="x-default" href="https://pkuproef.nl/nl/">
    <meta http-equiv="refresh" content="0; url=nl/index.html">
    <script>
        // Redirect naar NL versie (of EN op basis van browser taal)
        const userLang = navigator.language || navigator.userLanguage;
        if (userLang.startsWith('en')) {
            window.location.href = 'en/index.html';
        } else {
            window.location.href = 'nl/index.html';
        }
    </script>
</head>
<body>
    <p>Redirecting... / Doorverwijzen...</p>
    <p><a href="nl/index.html">Nederlands</a> | <a href="en/index.html">English</a></p>
</body>
</html>
